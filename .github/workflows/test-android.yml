name: Test Android

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  # paths-filter lists the PR's files through the API (see playwright.yml).
  pull-requests: read

jobs:
  # Only run when the Android app changed (same pattern as test-backend.yml, PR #43).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          changed:
            - android/**
            - .github/workflows/test-android.yml

  test-android:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AGP 9.5 needs JDK 17 or newer (memory/research/android.md#android).
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # Validates the wrapper jar's checksum and caches Gradle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # JVM only: Compose tests run under Robolectric, no emulator (design.md, Decision 5).
      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Store test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          retention-days: 14

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-test-android:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - test-android
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-android
