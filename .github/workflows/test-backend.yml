name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  # paths-filter lists the PR's files through the API (see playwright.yml).
  pull-requests: read

jobs:
  # Only run when something this job tests changed (docs/memory-only PRs skip it). Same pattern as
  # playwright.yml: a filter job plus an alls-green job that always reports, so the check never hangs as
  # "pending" if it ever becomes required by branch protection (a trigger-level paths-ignore would).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          changed:
            - backend/**
            - .env.example
            - compose*.yml
            - .python-version
            - pyproject.toml
            - uv.lock
            - .github/workflows/test-backend.yml

  test-backend:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # .env is untracked (real secrets); CI runs on the example defaults
      - name: Create .env from example
        run: cp .env.example .env
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
      - run: docker compose down -v --remove-orphans
      # pytest only talks to the ephemeral test DB (TEST_DATABASE_URL from
      # .env); the suite migrates it itself, so no prestart step is needed.
      - run: docker compose up -d --wait db-test mailpit
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for $SHA"
        working-directory: backend
        env:
          SHA: ${{ github.sha }}
      - run: docker compose down -v --remove-orphans
        if: always()
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-test-backend:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - test-backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-backend
