name: Test Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  # paths-filter lists the PR's files through the API (see playwright.yml).
  pull-requests: read

jobs:
  # Only run when something this job tests changed (docs/memory-only PRs skip it). Same pattern as
  # playwright.yml: a filter job plus an alls-green job that always reports, so the check never hangs as
  # "pending" if it ever becomes required by branch protection (a trigger-level paths-ignore would).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          changed:
            - backend/**
            - .env.example
            - compose*.yml
            - .python-version
            - pyproject.toml
            - uv.lock
            - frontend/**
            - package.json
            - bun.lock
            - .github/workflows/test-docker-compose.yml

  test-docker-compose:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # .env is untracked (real secrets); CI runs on the example defaults
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose run --rm backend bash scripts/prestart.sh
      - run: docker compose up -d --wait backend adminer
      - name: Test backend is up
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl http://localhost:8000
      - run: docker compose down -v --remove-orphans

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-test-docker-compose:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - test-docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-docker-compose
