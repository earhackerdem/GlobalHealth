# typos (pre-commit hook) está pensado para código/prosa en inglés; la
# documentación del producto y la memoria del repo se escriben en es-MX y
# disparan falsos positivos ("profesional" → "professional", etc.).
# Palabras sueltas en español dentro de strings de código (producto es-MX,
# NFR-012); los archivos que son prosa española completa van a extend-exclude.
[default.extend-words]
mis = "mis"
confidencial = "confidencial"
# es-MX structural strings in tests/backend (NFR-012): pure-ASCII Spanish
# words typos mistakes for English typos
caracteres = "caracteres"
componente = "componente"
historial = "historial"
cliente = "cliente"
imposible = "imposible"
posible = "posible"
informativo = "informativo"
Varios = "Varios"
condicional = "condicional"
ser = "ser"
profesional = "profesional"
excede = "excede"
requiere = "requiere"
directos = "directos"
accesible = "accesible"
foto = "foto"
importante = "importante"
visibles = "visibles"
# nombre real de la action re-actors/alls-green (workflows del template)
alls = "alls"

[files]
extend-exclude = [
    "harness.json",
    # capa agéntica VENDIDA (harness): ejemplos es-MX y fragmentos de regex; no se edita en el proyecto
    ".agents/",
    "scripts/",
    # comentarios es-MX de los comandos del proyecto
    "project.mk",
    # prosa/UI es-MX
    "backend/app/core/consent_text.py",
    "frontend/src/locales/",
    "backend/app/email-templates/",
    "packages/react-email/emails/",
    "frontend/src/components/Consent/",
    "memory/",
    "openspec/",
    "product/",
    "changes/",
    "docs/",
    "AGENTS.md",
    "CLAUDE.md",
    "CHANGELOG.md",
]
